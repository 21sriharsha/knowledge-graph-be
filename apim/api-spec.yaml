openapi: 3.1.0
info:
  title: Knowledge Platform API
  description: |
    Read models, search and knowledge-graph APIs for the knowledge
    publishing platform.

    The backend returns JSON read models only. Article bodies arrive as a
    structured block tree rather than HTML: presentation belongs to the
    frontend, and keeping markup out of the API is also what keeps the
    frontend from becoming a sanitisation boundary.

    Public read endpoints are anonymous. Everything under /api/studio
    requires the AUTHOR role. Webhook endpoints are anonymous at the HTTP
    layer and authenticated by provider signature.
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Delivery
  description: Read models for the public reading experience
- name: Assets
  description: "Images referenced by articles, proxied from their repository"
- name: Search
  description: "Hybrid lexical, semantic and metadata retrieval"
- name: Accounts
  description: "Who may sign in, and what they may do"
- name: "Studio: Sources"
  description: Connected external repositories
- name: Authors
  description: Author identity and profiles
- name: Graph
  description: Bounded neighbourhoods of the knowledge graph
- name: "Studio: Articles"
  description: Editorial article management
- name: Webhooks
  description: "Provider callbacks. Authenticated by signature, not session."
- name: "Studio: Ingestion"
  description: Materialization runs and their diagnostics
paths:
  /api/studio/sources/{id}:
    get:
      tags:
      - "Studio: Sources"
      summary: Fetch one connected repository
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceResponse"
    put:
      tags:
      - "Studio: Sources"
      summary: Update a connection. Omitted credentials are left unchanged.
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceResponse"
  /api/studio/authors/{slug}:
    put:
      tags:
      - Authors
      summary: Update an author's profile
      operationId: updateAuthor
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthorProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthorResponse"
  /api/studio/accounts/{accountId}/roles/{role}:
    put:
      tags:
      - Accounts
      summary: Grant a role
      operationId: grant
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: role
        in: path
        required: true
        schema:
          type: string
          enum:
          - AUTHOR
          - ADMIN
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
    delete:
      tags:
      - Accounts
      summary: Revoke a role
      description: |
        Refuses to remove the last administrator: an installation where nobody can grant
        roles is repairable only by editing the database.
      operationId: revoke
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: role
        in: path
        required: true
        schema:
          type: string
          enum:
          - AUTHOR
          - ADMIN
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/studio/accounts/{accountId}/author:
    put:
      tags:
      - Accounts
      summary: Link an account to the byline it writes under
      description: |
        Deliberately manual. An author row is created during ingestion from an unverified
        name in a committed Markdown file, so matching it to a sign-in identity by email
        would let anyone with commit access claim that identity.

        One byline, one account: linking an author already claimed elsewhere is refused.
      operationId: linkAuthor
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkAuthorRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
    delete:
      tags:
      - Accounts
      summary: Unlink an account from its byline
      operationId: unlinkAuthor
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/webhooks/sources/{repositoryId}:
    post:
      tags:
      - Webhooks
      summary: Accept a provider webhook for one connected repository
      operationId: receive
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/studio/sources:
    get:
      tags:
      - "Studio: Sources"
      summary: List connected repositories
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceResponse"
    post:
      tags:
      - "Studio: Sources"
      summary: Connect a repository. Credentials are stored encrypted and never returned.
      operationId: connect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceResponse"
  /api/studio/sources/{id}/sync:
    post:
      tags:
      - "Studio: Sources"
      summary: Request a full re-materialization. Returns immediately; work is deferred.
      operationId: sync
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
  /api/studio/sources/{id}/activate:
    post:
      tags:
      - "Studio: Sources"
      summary: Resume synchronization for a repository
      operationId: activate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceResponse"
    delete:
      tags:
      - "Studio: Sources"
      summary: "Stop synchronizing a repository, retaining its content and connection"
      operationId: deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SourceResponse"
  /api/studio/articles/{slug}/unpublish:
    post:
      tags:
      - "Studio: Articles"
      summary: Withdraw an article from publication
      operationId: unpublish
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ArticleResponse"
  /api/studio/articles/{slug}/publish:
    post:
      tags:
      - "Studio: Articles"
      summary: Publish an article
      operationId: publish
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ArticleResponse"
  /api/studio/articles/{slug}/archive:
    post:
      tags:
      - "Studio: Articles"
      summary: "Archive an article, retaining it so inbound links are not orphaned"
      operationId: archive
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ArticleResponse"
  /api/articles/{slug}/view:
    post:
      tags:
      - Delivery
      summary: Record that an article was read
      description: |
        Accepted and buffered rather than written immediately: reading is the hottest
        path in the application and a row per read would make every read a write.

        Deliberately fire-and-forget. The response carries no body and the caller is not
        expected to care whether it succeeded -- a miscounted view is not worth a retry,
        and never worth delaying a page.
      operationId: recordView
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: Accepted
  /api/topics:
    get:
      tags:
      - Delivery
      summary: Every topic with published content
      description: "Topics with nothing published are omitted: a browse index that\
        \ lists empty subjects makes the reader discover the emptiness by clicking."
      operationId: topics
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaxonomyListing"
  /api/topics/{slug}:
    get:
      tags:
      - Delivery
      summary: The topic landing page read model
      operationId: topic
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TopicReadModel"
  /api/tags:
    get:
      tags:
      - Delivery
      summary: Every tag with published content
      operationId: tags
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaxonomyListing"
  /api/tags/{slug}:
    get:
      tags:
      - Delivery
      summary: The tag landing page read model
      operationId: tag
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TagReadModel"
  /api/studio/me:
    get:
      tags:
      - Accounts
      summary: "The signed-in account, including its roles and linked byline"
      description: |
        Reachable by any authenticated caller, including one with no roles at all --
        which is every account on its first sign-in. It is how the studio knows whether
        to show an empty page or an explanation, and an account that cannot ask this
        cannot be told why it can do nothing.
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/studio/ingestions:
    get:
      tags:
      - "Studio: Ingestion"
      summary: "Recent ingestion runs, without diagnostics"
      operationId: recent
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: repositoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestionRunResponse"
  /api/studio/ingestions/{id}:
    get:
      tags:
      - "Studio: Ingestion"
      summary: "One ingestion run, with every diagnostic it produced"
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IngestionRunResponse"
  /api/studio/ingestions/pipeline:
    get:
      tags:
      - "Studio: Ingestion"
      summary: "The configured handler chain, in execution order"
      description: "Reports the pipeline as actually assembled, not as documented."
      operationId: pipeline
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
  /api/studio/articles:
    get:
      tags:
      - "Studio: Articles"
      summary: Published articles this account may edit
      operationId: list_1
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseArticleResponse"
  /api/studio/articles/{slug}:
    get:
      tags:
      - "Studio: Articles"
      summary: "Fetch an article in its editorial form, whatever its publication state"
      operationId: get_2
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ArticleResponse"
  /api/studio/accounts:
    get:
      tags:
      - Accounts
      summary: Every account that has signed in
      description: |
        Including those with no roles. A new sign-in appears here immediately and can do
        nothing until granted a role -- this list is where an administrator discovers
        that someone is waiting.
      operationId: accounts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponse"
  /api/search:
    get:
      tags:
      - Search
      summary: Search the knowledge base
      description: |
        Natural-language queries are interpreted into a structured intent before retrieval;
        simple queries bypass that step entirely. The response reports how the query was
        understood and which retrieval mode ran, so an unexpected result set can be
        explained without reading the logs.
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: understand
        in: query
        description: Force query understanding on or off; omit to let the analyzer
          decide
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /api/search/suggest:
    get:
      tags:
      - Search
      summary: Suggestions for a partially typed query
      description: |
        Prefix and substring matches on article titles and author names, for a search
        box's typeahead. Deliberately not a shortened search: full-text retrieval matches
        stemmed whole words and so returns nothing for a word the reader has not finished
        typing. No query understanding runs here -- there is nothing to interpret in three
        characters. A query shorter than two characters returns an empty list.
      operationId: suggest
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 6
          maximum: 10
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchSuggestion"
  /api/routes/resolve:
    get:
      tags:
      - Delivery
      summary: Resolve a public URL path to what lives at it
      description: |
        The backend owns URL structure, so the frontend asks what a path is rather than
        inferring it from path shape. That is what lets an article be renamed without the
        frontend needing to know.
      operationId: resolveRoute
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RouteTarget"
  /api/navigation:
    get:
      tags:
      - Delivery
      summary: Site navigation
      operationId: navigation
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NavigationModel"
  /api/graph:
    get:
      tags:
      - Graph
      summary: "Neighbourhood around an article, addressed by slug"
      operationId: bySlug
      parameters:
      - name: slug
        in: query
        required: true
        schema:
          type: string
      - name: depth
        in: query
        description: Hops from the origin; clamped to knowledge.graph.max-depth
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          maximum: 5
          minimum: 1
      - name: includeSuggestions
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GraphNeighbourhood"
  /api/graph/{nodeId}:
    get:
      tags:
      - Graph
      summary: "Neighbourhood around an article, addressed by id"
      operationId: byNodeId
      parameters:
      - name: nodeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: depth
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          maximum: 5
          minimum: 1
      - name: includeSuggestions
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GraphNeighbourhood"
  /api/graph/overview:
    get:
      tags:
      - Graph
      summary: "A bounded sample of the whole graph, for an overview surface"
      description: |
        Returns a capped sample seeded from the most-connected articles, never the whole
        graph: an unbounded traversal on an anonymous endpoint is a denial-of-service
        primitive, and no client can usefully draw a corpus-sized graph anyway.
      operationId: overview
      parameters:
      - name: maxNodes
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 40
          maximum: 150
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GraphNeighbourhood"
  /api/authors:
    get:
      tags:
      - Authors
      summary: List authors
      operationId: listAuthors
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAuthorResponse"
  /api/authors/{slug}:
    get:
      tags:
      - Authors
      summary: Fetch an author's public profile
      operationId: getAuthor
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthorResponse"
  /api/authors/{slug}/page:
    get:
      tags:
      - Delivery
      summary: The author page read model
      operationId: author
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthorReadModel"
  /api/assets/{repositoryId}/**:
    get:
      tags:
      - Assets
      summary: An image referenced by an article
      description: |
        Fetched live from the repository, never stored. This is what makes images in a
        private repository work: the reader's browser has no credential, so a provider
        URL would fail for them, and this call carries the repository's own.

        Anything that is not an image is refused, and refusal is indistinguishable from
        absence -- both answer 404, so the response cannot be used to discover which
        repositories exist or what is in them.
      operationId: asset
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/articles:
    get:
      tags:
      - Delivery
      summary: "The article archive, newest first"
      operationId: articles
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseArticleReference"
  /api/articles/{slug}:
    get:
      tags:
      - Delivery
      summary: The complete article page read model
      description: |
        Includes body blocks, outline, author, taxonomy, related articles, backlinks,
        breadcrumbs, previous/next navigation and a bounded graph neighbourhood --
        everything a normal article page needs, with no follow-up calls.
      operationId: article
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ArticleReadModel"
  /api/articles/trending:
    get:
      tags:
      - Delivery
      summary: The most-read articles over a window
      description: |
        Ordered by recorded views, most recent window first. Empty until something has
        actually been read -- there is no synthetic ordering to fall back on, and a
        trending list padded with unread articles would mean nothing.

        Counting is anonymous: the platform records how often an article was read and
        nothing about who read it.
      operationId: trending
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 7
          maximum: 365
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 6
          maximum: 50
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendingArticle"
components:
  schemas:
    UpdateSourceRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 200
          minLength: 0
        defaultBranch:
          type: string
          maxLength: 200
          minLength: 0
        contentPath:
          type: string
          maxLength: 500
          minLength: 0
        apiBaseUrl:
          type: string
          maxLength: 500
          minLength: 0
        ownerAuthorId:
          type: string
          format: uuid
        accessToken:
          type: string
          maxLength: 500
          minLength: 0
        webhookSecret:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - displayName
    SourceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceType:
          type: string
          enum:
          - GITHUB
          - GITLAB
          - AZURE_DEVOPS
        displayName:
          type: string
        owner:
          type: string
        repository:
          type: string
        project:
          type: string
        defaultBranch:
          type: string
        contentPath:
          type: string
        apiBaseUrl:
          type: string
        ownerAuthorId:
          type: string
          format: uuid
        active:
          type: boolean
        accessTokenConfigured:
          type: boolean
        webhookSecretConfigured:
          type: boolean
        lastSyncedRevision:
          type: string
        lastSyncedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    UpdateAuthorProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 200
          minLength: 0
        biography:
          type: string
