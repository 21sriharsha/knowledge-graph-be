# Ryuk is Testcontainers' cleanup sidecar. It needs a privileged container with access to the
# container runtime's socket, which rootless Podman does not grant, so it is disabled here and
# containers are torn down by the JVM shutdown hook instead.
#
# The trade-off is that a hard-killed JVM can leave a container behind. That is acceptable for a
# local test run and is the standard configuration for Podman; a CI environment running Docker can
# re-enable it.
ryuk.disabled=true
